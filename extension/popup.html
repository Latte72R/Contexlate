<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLaMo Translate</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup"><main>
<header><div class="brand"><img src="icons/48.png" alt=""><div><h1>PLaMo Translate</h1><p class="sub">ページを、いつもの言葉で。</p></div></div><button class="link" id="settings">設定</button></header>
<label class="field" for="targetLang">翻訳先</label><select id="targetLang"></select>
<fieldset class="modes"><legend>表示方法</legend>
<label class="mode"><input type="radio" name="mode" value="bilingual" checked><span><strong>原文の下に併記</strong><small>原文を読みながら訳文を確認</small></span></label>
<label class="mode"><input type="radio" name="mode" value="replace"><span><strong>ページ全体を翻訳</strong><small>レイアウトを保ち、文字を置き換え</small></span></label>
</fieldset>
<button class="primary wide" id="translate" disabled>このページを翻訳</button>
<div class="actions"><button class="secondary" id="stop" disabled>中止</button><button class="secondary" id="restore" disabled>原文に戻す</button></div>
<progress id="progress" hidden></progress><p class="status" id="status" role="status" aria-live="polite"></p>
<footer>一部分だけなら、文字を選択して右クリック。</footer>
</main><script type="module" src="popup.js"></script></body></html>
