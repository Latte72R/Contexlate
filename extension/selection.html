<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選択文の翻訳 · Contexlate</title><link rel="stylesheet" href="ui.css"></head>
<body class="selection"><main>
<header><div class="brand"><img src="icons/logo.svg" alt=""><div><h1>選択文の翻訳</h1><p class="sub">Contexlate</p></div></div><button class="link" id="settings">設定</button></header>
<label for="targetLang" class="field">翻訳先</label><select id="targetLang"></select>
<div class="card result"><h2>訳文</h2><div class="translation" id="translation" dir="auto"></div></div>
<p class="status" id="status" role="status" aria-live="polite"></p>
<div class="actions"><button class="primary" id="retry" disabled>翻訳する</button><button class="secondary" id="stop" disabled>中止</button><button class="secondary" id="copy" disabled>訳文をコピー</button></div>
<details class="card"><summary>原文</summary><div id="original" class="original" dir="auto"></div></details>
<footer><div class="legal"><span>© 2026 Latte72</span><span aria-hidden="true">·</span><a href="https://github.com/Latte72R/Contexlate/blob/main/LICENSE" target="_blank" rel="noopener noreferrer" aria-label="MITライセンスを開く">MIT License</a></div></footer>
</main><script type="module" src="selection.js"></script></body></html>
